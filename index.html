<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#08060d">
  <meta name="description" content="Plugins NexusToons e Pluma Comics para Nyxovira.">
  <link rel="nyxovira-plugin-catalog" href="catalog.json">
  <title>0w0 UwU -_o — Catálogo de plugins</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20260902-border-fix-4">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#top" aria-label="0w0 UwU -_o — início">
      <img src="assets/logo.svg" alt="" width="38" height="38">
      <span><strong>0w0</strong> UwU <b>-_o</b></span>
    </a>
  </header>

  <main id="top" class="page-shell">
    <section class="catalog" aria-label="Plugins">
      <div class="catalog-heading">
        <p>Plugins</p>
        <h1>Plugins disponíveis</h1>
      </div>
      <div class="toolbar">
        <label class="search-box">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.15a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
          <span class="sr-only">Buscar plugins</span>
          <input id="searchInput" type="search" placeholder="Buscar plugin…" autocomplete="off">
        </label>
        <div id="filters" class="filters" aria-label="Filtrar catálogo"></div>
      </div>

      <div id="pluginGrid" class="plugin-grid" aria-live="polite"></div>
      <div id="emptyState" class="empty-state" hidden>
        <div>⌕</div>
        <h3>Nenhum plugin encontrado</h3>
        <p>Tente outra busca ou selecione “Todos”.</p>
      </div>
    </section>
  </main>

  <template id="pluginCardTemplate">
    <article class="plugin-card">
      <div class="card-top">
        <div class="icon-wrap"><img class="plugin-icon" alt="" width="56" height="56"></div>
        <div class="plugin-heading">
          <div class="title-line"><h3></h3><span class="status"><i></i> Disponível</span></div>
          <p class="domain"></p>
        </div>
      </div>
      <p class="description"></p>
      <div class="tags"></div>
      <div class="details">
        <span class="version"></span>
        <span class="adapter"></span>
      </div>
      <div class="actions">
        <button class="install-plugin" type="button">Instalar</button>
        <a class="open-site" target="_blank" rel="noopener noreferrer">Site <span>↗</span></a>
      </div>
    </article>
  </template>

  <dialog id="installDialog" class="install-dialog">
    <button id="closeInstallDialog" class="dialog-close" type="button" aria-label="Fechar">×</button>
    <img src="assets/logo.svg" alt="" width="48" height="48">
    <p class="eyebrow">Instalar no Nyxovira</p>
    <h2>Catálogo pronto para usar</h2>
    <p>No Nyxovira, abra <strong>Sites → Catálogos externos</strong>, cole a URL abaixo e toque em <strong>Adicionar</strong>. Depois use o botão Instalar do plugin.</p>
    <div class="catalog-url-row">
      <code id="catalogUrl"></code>
      <button id="copyDialogUrl" type="button">Copiar</button>
    </div>
    <p id="installStatus" class="install-status" aria-live="polite"></p>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js?v=20260902-border-fix-4"></script>
</body>
</html>
